version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: medigrid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medigrid
      POSTGRES_PASSWORD: medigrid_password
      POSTGRES_DB: medigrid_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medigrid -d medigrid_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medigrid-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
